name: Release

# Cuts a release whenever a `v*` tag is pushed. The release-please bot opens a
# release PR on every merge to master; merging that PR creates the tag and
# triggers this workflow. See RELEASE.md for the full flow.
#
# The build itself (GoReleaser, GPG signing, build provenance attestation,
# CycloneDX SBOM) lives in namecheap/terraform-provider-workflows, pinned by commit SHA.
# Dependabot bumps the SHA and the version comment.
on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release:
    name: Release
    # The called workflow can only use what is granted here: contents to
    # publish the GitHub Release, id-token and attestations to attest build
    # provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: namecheap/terraform-provider-workflows/.github/workflows/release.yml@6939aa96ddb124c103ac748edf490c7013c7e851 # v1.1.1
    with:
      # Attach terraform-provider-namecheap_<tag>_sbom.cdx.json to the release;
      # see SECURITY_COMPLIANCE.md.
      sbom: true
    secrets:
      gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      passphrase: ${{ secrets.PASSPHRASE }}
