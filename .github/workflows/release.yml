name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser binary to an exact version so a breaking
          # upstream minor release (has happened: v2 config schema) can't
          # silently break a tagged release. Bump this line when the
          # maintainer has reviewed the release notes at
          # https://github.com/goreleaser/goreleaser/releases.
          version: v2.15.4
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find checksums file
        id: checksums
        run: echo "path=$(ls dist/*_SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      - name: Generate CycloneDX SBOM for release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Keep the Trivy binary in sync with the CI scan (.github/workflows/ci.yml).
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: terraform-provider-namecheap_${{ github.ref_name }}_sbom.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "terraform-provider-namecheap_${{ github.ref_name }}_sbom.cdx.json" \
            --clobber
