name: Scheduled security scan

# New advisories are published without any change here, so PR and push scans
# miss them. This runs the same gates weekly on the default branch (master).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: Security
    permissions:
      contents: read
    uses: namecheap/terraform-provider-workflows/.github/workflows/security-scan.yml@a999875767b285b80f3478eaa5c73c1adb38d7f6 # v1.1.2
