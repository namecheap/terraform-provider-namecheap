name: Scheduled security scan

# New advisories are published without any change here, so PR and push scans
# miss them. This runs the same gates weekly on the default branch (master).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: Security
    permissions:
      contents: read
    uses: namecheap/terraform-provider-workflows/.github/workflows/security-scan.yml@6939aa96ddb124c103ac748edf490c7013c7e851 # v1.1.1
