name: Versioning

# Runs release-please after every successful CI run on master. The job, its
# fork guard and the App token live in namecheap/terraform-provider-workflows,
# pinned by commit SHA. See RELEASE.md.
on:
  # workflow_run runs with secrets, so a run triggered from a fork could be
  # dangerous. Here it checks out no code and runs only release-please, and
  # the called workflow skips runs that did not succeed or came from a fork.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

# Serialize release-please runs: back-to-back merges to master produce
# overlapping CI successes that would otherwise race on the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

# The default GITHUB_TOKEN needs nothing: every write goes through the App
# token.
permissions: {}

jobs:
  versioning:
    name: Versioning
    uses: namecheap/terraform-provider-workflows/.github/workflows/versioning.yml@7ef9d6abe17fefeb269cd485bcf4c41401592700 # v1.1.0
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
