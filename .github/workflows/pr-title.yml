name: PR Title Check

# Requires a Conventional Commit PR title; release-please reads it from the
# squash commit. The check lives in namecheap/terraform-provider-workflows and
# reports as "PR Title / Conventional PR Title".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: PR Title
    permissions:
      pull-requests: read
    uses: namecheap/terraform-provider-workflows/.github/workflows/pr-title.yml@7ef9d6abe17fefeb269cd485bcf4c41401592700 # v1.1.0
