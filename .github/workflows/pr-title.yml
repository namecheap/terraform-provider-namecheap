name: PR Title Check

# Requires a Conventional Commit PR title; release-please reads it from the
# squash commit. The check lives in namecheap/terraform-provider-workflows and
# reports as "PR Title / Conventional PR Title".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: PR Title
    permissions:
      pull-requests: read
    uses: namecheap/terraform-provider-workflows/.github/workflows/pr-title.yml@dd301c63e4d08c2b84a7512b2e618d49e6432c4e # v1.0.0
