name: PR Title Check

# Requires a Conventional Commit PR title; release-please reads it from the
# squash commit. The check lives in namecheap/terraform-provider-workflows and
# reports as "PR Title / Conventional PR Title".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: PR Title
    permissions:
      pull-requests: read
    uses: namecheap/terraform-provider-workflows/.github/workflows/pr-title.yml@6939aa96ddb124c103ac748edf490c7013c7e851 # v1.1.1
