name: CI

# How the jobs fit together, and the invariants to keep when editing this
# file, are in CI.md.
on:
  push:
    branches:
      - master
  # Not pull_request_target: fork PRs get a read-only token and no secrets.
  pull_request:
  # Full run on any ref, including live acceptance on Dependabot branches.
  workflow_dispatch:

permissions:
  contents: read

# No top-level concurrency group: it would drop queued runs. Only start-runner
# serializes, because the sandbox EIP can serve one runner at a time.

env:
  SANDBOX_EIP_ALLOCATION_ID: ${{ vars.SANDBOX_EIP_ALLOCATION_ID }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter reads PR files via the API
      checks: read # already-tested reads the PR head's "Acceptance test" check
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter-code.outputs.code }}
      # Live sandbox acceptance: trusted code with secrets (same-repo PR, push
      # to master, dispatch), never Dependabot, and not a push whose tree
      # already passed acceptance on its PR.
      live: >-
        ${{
          (github.event_name == 'workflow_dispatch' || steps.filter-code.outputs.code == 'true') &&
          steps.already-tested.outputs.skip != 'true' &&
          github.actor != 'dependabot[bot]' &&
          ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
           github.event_name == 'workflow_dispatch')
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}

      # `every`: a file is code unless it is root-level markdown, LICENSE or the
      # release-please manifest. Nested markdown (docs/, templates/) is code.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter-code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!*.md'
              - '!LICENSE'
              - '!.release-please-manifest.json'

      # Post-merge acceptance skip; see CI.md. Any failure leaves skip=false.
      - name: Check whether this merge was already acceptance-tested
        id: already-tested
        if: ${{ github.event_name == 'push' && steps.filter-code.outputs.code == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          decide() {
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            echo "Live acceptance on this push: $([ "$1" = true ] && echo skipped || echo runs) — $2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\")] | first | select(.) | \"\(.number) \(.head.sha)\"") \
            || decide false "could not look up the PR for $SHA"
          [ -n "$pr" ] || decide false "$SHA is not a PR merge commit"
          read -r number head <<<"$pr"

          merge_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || decide false "could not read tree of $SHA"
          head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || decide false "could not read tree of PR #$number head $head"
          [ "$merge_tree" = "$head_tree" ] || decide false "PR #$number head tree differs from the merge (branch was behind master)"

          acceptance=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=Acceptance%20test&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | first | .conclusion // "none"') \
            || decide false "could not read check runs of PR #$number head $head"
          [ "$acceptance" = success ] || decide false "PR #$number head's Acceptance test is '$acceptance', not success"

          decide true "identical tree passed Acceptance test on PR #$number (${head:0:7})"

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go pins an exact go.mod version even with check-latest; passing
      # the minor lets it pick the newest patch.
      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Verify module integrity
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        run: make test

      # Wrapper off so make sees terraform's real exit codes.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The only place a same-repo PR runs the mock suite, and the source of
      # CRUD coverage.
      - name: Mock acceptance tests (coverage)
        run: make testacc-mock

      # One upload for both profiles, so Codecov reports a single status.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out,coverage-acceptance.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Docs are generated and current
        run: make docs-check

      - name: Examples type-check against this provider
        run: make examples-validate

  # Trivy and govulncheck gates plus the summary comment, from the shared
  # workflow; see CI.md.
  security:
    name: Security
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
      pull-requests: write # sticky summary comment
      security-events: read # open CodeQL alerts for the summary
    uses: namecheap/terraform-provider-workflows/.github/workflows/security-scan.yml@a999875767b285b80f3478eaa5c73c1adb38d7f6 # v1.1.2
    with:
      report: true

  # Engine/version matrix of the mock suite, and the acceptance path for fork
  # and Dependabot PRs, which have no secrets for the live suite.
  acceptance_mock:
    name: Mock acceptance (${{ matrix.engine }} ${{ matrix.version }})
    needs: [changes, check]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: "1.5.7" # minimum supported Terraform
          - engine: terraform
            version: "1.17.0" # same series as the live suite
          - engine: opentofu
            version: "1.12.3" # latest OpenTofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Set up Terraform
        if: ${{ matrix.engine == 'terraform' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: ${{ matrix.engine == 'opentofu' }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      # Don't set TF_ACC_PROVIDER_NAMESPACE: import steps resolve the provider
      # under the default namespaces (see TestAccMockDomainHostRecordImportFormats).
      - name: Mock acceptance tests
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "${ENGINE}" = "opentofu" ]; then
            bin="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST="registry.opentofu.org"
          else
            bin="$(command -v terraform)"
          fi
          export TF_ACC_TERRAFORM_PATH="${bin}"
          make testacc-mock

  start-runner:
    name: Start self-hosted EC2 runner
    needs: [changes, check, security]
    if: ${{ needs.changes.outputs.live == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # action-workflow-queue lists workflow runs
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
      public-ip: ${{ steps.eip-ip.outputs.public-ip }}
    steps:
      # FIFO behind older runs, so only one runner holds the sandbox EIP.
      # The action is a Docker image referenced by tag, which a SHA pin of the
      # action does not freeze; this job holds AWS and App keys, so the image
      # is pinned by digest. Inputs the action would default are passed here.
      - name: Wait for older acceptance runs to finish (single sandbox EIP)
        uses: docker://ghcr.io/ahmadnassri/action-workflow-queue@sha256:97df572a56aabf00d05dd252004192877ba0c80fee6e8d9775b9c060f4b2004d # 1.2.0
        with:
          github-token: ${{ github.token }}
          timeout: 1800000 # 30 min
          delay: 10000
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write # self-hosted runner registration and removal only
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      # TEMPORARY until namecheap/ec2-github-runner#76 is fixed: the action
      # associates the EIP once, warn-only, and loses the race with the
      # previous instance's termination. Wait until the EIP is free.
      - name: Wait for the sandbox EIP to be free
        run: |
          timeout_s=300 # above the observed 22-152s stop->terminated band
          interval_s=5
          attempts=$(( timeout_s / interval_s ))
          for i in $(seq 1 "$attempts"); do
            if ! assoc="$(aws ec2 describe-addresses \
              --allocation-ids "$SANDBOX_EIP_ALLOCATION_ID" \
              --query 'Addresses[0].AssociationId' --output text)"; then
              echo "::warning::describe-addresses failed (attempt ${i}/${attempts}); retrying."
              sleep "$interval_s"
              continue
            fi
            if [ -z "$assoc" ] || [ "$assoc" = "None" ]; then
              echo "Sandbox EIP is free."
              exit 0
            fi
            echo "Sandbox EIP still associated (${assoc}); waiting for the previous instance to finish terminating (${i}/${attempts})..."
            sleep "$interval_s"
          done
          echo "::warning::Sandbox EIP still associated after ${timeout_s}s; proceeding — if it is still attached at launch, expect start-runner to fail at the action's registration timeout (the EIP is the runner's only whitelisted egress)."
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: namecheap/ec2-github-runner@9d745d6fb60fa206b168129c03893347d9562755 # main @ 2026-10-06: v4.0.3 + --no-default-labels (ec2-github-runner#83)
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-owner: 699717368611
          ec2-image-filters: >
            [
              { "Name": "name", "Values": ["nc-al2023-ami-hvm-x86_64-master-*"] }
            ]
          ec2-instance-type: t3.medium
          subnet-id: subnet-01c4ff5a
          security-group-id: sg-106ec76d
          iam-role-name: AmazonSSMRoleForInstancesQuickSetup
          encrypt-ebs: "true"
          # The sandbox API allows only this IP, and the instance needs it for
          # egress while it registers.
          eip-allocation-id: ${{ env.SANDBOX_EIP_ALLOCATION_ID }}
          aws-resource-tags: >
            [
              { "Key": "Name", "Value": "github_runner" },
              { "Key": "GitHubRepository", "Value": "${{ github.repository }}" }
            ]
      # The action's association is warn-only, so assert the EIP is on the
      # launched instance. Read-only: re-associating would cut the runner off.
      - name: Resolve sandbox EIP public IP
        id: eip-ip
        env:
          LAUNCHED_INSTANCE_ID: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
        run: |
          out="$(aws ec2 describe-addresses \
            --allocation-ids "$SANDBOX_EIP_ALLOCATION_ID" \
            --query 'Addresses[0].[PublicIp,InstanceId]' --output text)"
          ip="$(printf '%s' "$out" | cut -f1)"
          assoc_instance="$(printf '%s' "$out" | cut -f2)"
          if [ -z "$ip" ] || [ "$ip" = "None" ]; then
            echo "::error::Could not resolve a public IP for allocation ${SANDBOX_EIP_ALLOCATION_ID}."
            exit 1
          fi
          if [ "$assoc_instance" != "$LAUNCHED_INSTANCE_ID" ]; then
            echo "::error::Sandbox EIP ${SANDBOX_EIP_ALLOCATION_ID} is associated with '${assoc_instance}', not the launched runner instance '${LAUNCHED_INSTANCE_ID}' — the action's warn-only AssociateAddress did not take effect."
            exit 1
          fi
          echo "public-ip=${ip}" >> "$GITHUB_OUTPUT"

  acceptance_test:
    name: Acceptance test
    runs-on: ${{ needs.start-runner.outputs.label }}
    needs: [changes, start-runner]
    if: ${{ needs.changes.outputs.live == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Go patch of go.mod's minor, falling back to go.mod's exact
      # version. Terraform: latest patch of tf_minor; a newer minor fails the
      # build so a maintainer reviews it before bumping tf_minor/tf_fallback.
      - name: Resolve toolchain versions
        id: versions
        run: |
          go_required="$(awk '/^go / {print $2; exit}' go.mod)"
          go_minor="$(printf '%s' "${go_required}" | cut -d. -f1,2)"
          latest_go="$(curl -fsSL https://go.dev/VERSION?m=text | head -1 | sed 's/^go//')"
          latest_minor="$(printf '%s' "${latest_go}" | cut -d. -f1,2)"
          if [ -n "${latest_go}" ] && [ "${latest_minor}" = "${go_minor}" ]; then
            go_version="${latest_go}"
          else
            go_version="${go_required}"
          fi
          echo "Using Go ${go_version} (go.mod pins ${go_minor}.x)"
          echo "go_version=${go_version}" >> "$GITHUB_OUTPUT"

          tf_minor="1.17"
          tf_fallback="1.17.0" # when the lookup is unavailable
          latest_tf="$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform | sed -n 's/.*"current_version":"\([^"]*\)".*/\1/p')"
          latest_minor="${latest_tf%.*}"
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" != "${tf_minor}" ] \
            && [ "$(printf '%s\n%s\n' "${tf_minor}" "${latest_minor}" | sort -V | tail -1)" = "${latest_minor}" ]; then
            echo "::error::A newer Terraform minor/major release exists (${latest_tf}, ${latest_minor}.x); pinned series is ${tf_minor}.x. Review changes and bump tf_minor/tf_fallback in .github/workflows/ci.yml."
            exit 1
          fi
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" = "${tf_minor}" ]; then
            tf_version="${latest_tf}"
          else
            tf_version="${tf_fallback}"
          fi
          echo "Using Terraform ${tf_version} (pinned series ${tf_minor}.x)"
          echo "tf_version=${tf_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        env:
          GO_VERSION: ${{ steps.versions.outputs.go_version }}
        run: |
          tarball="go${GO_VERSION}.linux-amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "https://dl.google.com/go/${tarball}"
          echo "$(curl -fsSL "https://dl.google.com/go/${tarball}.sha256")  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/${tarball}"
          echo "${RUNNER_TEMP}/go/bin" >> "$GITHUB_PATH"
          echo "GOCACHE=${RUNNER_TEMP}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go-mod" >> "$GITHUB_ENV"

      - name: Set up Terraform
        env:
          TF_VERSION: ${{ steps.versions.outputs.tf_version }}
        run: |
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          base="https://releases.hashicorp.com/terraform/${TF_VERSION}"
          curl -fsSLo "${RUNNER_TEMP}/${zip}" "${base}/${zip}"
          (cd "${RUNNER_TEMP}" && curl -fsSL "${base}/terraform_${TF_VERSION}_SHA256SUMS" | grep " ${zip}\$" | sha256sum -c -)
          unzip -o "${RUNNER_TEMP}/${zip}" -d "${RUNNER_TEMP}/terraform"
          echo "${RUNNER_TEMP}/terraform" >> "$GITHUB_PATH"
          echo "TF_ACC_TERRAFORM_PATH=${RUNNER_TEMP}/terraform/terraform" >> "$GITHUB_ENV"

      # Never run the live suite without the whitelisted IP.
      - name: Verify sandbox EIP
        env:
          EXPECTED_IP: ${{ needs.start-runner.outputs.public-ip }}
        run: |
          actual_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [ -z "${EXPECTED_IP}" ] || [ "${actual_ip}" != "${EXPECTED_IP}" ]; then
            echo "::error::Sandbox EIP mismatch: runner public IP is '${actual_ip}', expected the whitelisted sandbox EIP '${EXPECTED_IP}'. Refusing to run acceptance tests without the whitelisted IP."
            exit 1
          fi
          echo "Verified runner public IP (${actual_ip}) matches the whitelisted sandbox EIP."

      - name: Acceptance Test
        run: |
          export CGO_ENABLED=0
          make testacc
        env:
          NAMECHEAP_USER_NAME: saTerraformProvider
          NAMECHEAP_API_USER: saTerraformProvider
          NAMECHEAP_TEST_DOMAIN: terraform-provider-test.net
          NAMECHEAP_USE_SANDBOX: true
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          # Provider and test helpers each get half the account's 20/min
          # quota. Retries are spaced to wait out the window; see CI.md.
          NAMECHEAP_REQUESTS_PER_MINUTE: 10
          NAMECHEAP_MAX_RETRIES: 5
          NAMECHEAP_RETRY_BASE_DELAY: 10s
          NAMECHEAP_RETRY_MAX_DELAY: 60s
          NAMECHEAP_RETRY_MAX_ELAPSED: 8m

  # Not gated on `changes`: a started runner must always be stopped.
  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - acceptance_test
    runs-on: ubuntu-latest
    if: ${{ always() && needs.start-runner.outputs.ec2-instance-id != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write # self-hosted runner registration and removal only
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        if: always() # even if a step above failed
        uses: namecheap/ec2-github-runner@9d745d6fb60fa206b168129c03893347d9562755 # main @ 2026-10-06: v4.0.3 + --no-default-labels (ec2-github-runner#83)
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}

  # The single required check; see CI.md. Every other job must be in `needs`.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      - changes
      - check
      - docs
      - security
      - acceptance_mock
      - start-runner
      - acceptance_test
      - stop-runner
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert every job is watched by this gate
        run: |
          watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/ci.yml | sort)
          all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
          if ! diff <(echo "$all") <(echo "$watched"); then
            echo "::error::ci.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
            exit 1
          fi

      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled — see the results above."
            exit 1
          fi
