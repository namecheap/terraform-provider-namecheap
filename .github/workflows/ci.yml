name: CI

# No workflow-level paths-ignore here, on purpose. This workflow's jobs are
# required status checks, and a path-filtered required check is never reported
# on PRs that touch only excluded files, which blocks them from merging
# permanently. It would also stop versioning.yml's `workflow_run: [CI]` trigger
# from firing on pushes that only touch release files, breaking the
# release-please -> tag -> GoReleaser chain. Instead, the `changes` job below
# detects what changed and the expensive jobs skip themselves via `if:` —
# skipped checks DO satisfy branch protection, and the workflow still completes
# so workflow_run still fires.
on:
  # Post-merge run only: PR branches are covered by pull_request, so each PR
  # runs CI once. Pre-PR branches: use workflow_dispatch.
  push:
    branches:
      - master
  # Primary CI trigger for all PRs, forks included. NOT pull_request_target, so
  # fork PRs run with a read-only token and no secrets; the EC2 sandbox jobs
  # additionally require a same-repo PR (see start-runner below).
  pull_request:
  # Manual run on any ref under the dispatcher's identity — the path for live
  # acceptance on Dependabot branches (see CLAUDE.md).
  workflow_dispatch:

permissions:
  contents: read

env:
  # This repo's dedicated whitelisted sandbox Elastic IP allocation, consumed
  # by start-runner's `eip-allocation-id` input and its EIP-resolve step.
  # Sourced from a repo variable (not a literal) so another repo can adopt this
  # workflow with its own dedicated EIP without editing YAML — mirroring the
  # `vars.APP_CLIENT_ID` pattern used elsewhere. cleanup-ec2-runners.yml does
  # not declare or use this: EIP release there only ever happens as an
  # automatic AWS side effect of instance termination.
  SANDBOX_EIP_ALLOCATION_ID: ${{ vars.SANDBOX_EIP_ALLOCATION_ID }}

# This workflow intentionally has NO top-level `concurrency` group. A shared
# group serializes the whole workflow, but GitHub keeps only the newest queued
# run per group and cancels older pending ones — so two PRs pushed seconds apart
# silently drop each other's CI. Instead, the cheap `check`/`security` jobs run
# in parallel across PRs (never cancelled), and only `start-runner` serializes —
# it waits for older runs via ahmadnassri/action-workflow-queue so the single
# whitelisted Elastic IP is never associated by two EC2 runners at once. See the
# queue step in start-runner below.

jobs:
  # Gate job: decides whether the jobs below actually need to run for this
  # change. `code` is false only when the diff touches nothing but root-level
  # markdown (README/CHANGELOG/...), LICENSE, or the release-please manifest —
  # most notably the release-please Release PR (CHANGELOG.md +
  # .release-please-manifest.json) and its merge to master, which previously
  # re-ran the full pipeline — self-hosted EC2 acceptance run included — twice
  # per release on code that was already tested. docs/** and templates/**
  # deliberately count as code: docs/ is published to the Terraform Registry at
  # each release tag, so doc changes get the full pipeline like any
  # user-visible change.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter reads PR files via the API on pull_request events
    outputs:
      # workflow_dispatch is a maintainer explicitly asking for a full run (the
      # documented path for live acceptance on Dependabot branches — see
      # CLAUDE.md), and paths-filter has no base to diff against there anyway,
      # so dispatch runs always count as code and bypass the filter entirely.
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter-code.outputs.code }}
    steps:
      # Checkout is required for push events, where paths-filter diffs with git
      # (pull_request events use the API and would not need it).
      - uses: actions/checkout@v7
        if: ${{ github.event_name != 'workflow_dispatch' }}

      # With predicate-quantifier=every a file counts as `code` only if it
      # matches ALL patterns, i.e. it is none of the ignored kinds. `*.md`
      # (no globstar) matches root-level markdown only, so nested markdown —
      # docs/**, templates/** — still counts as code on purpose.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter-code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!*.md'
              - '!LICENSE'
              - '!.release-please-manifest.json'

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        # Extract just the MAJOR.MINOR (e.g. 1.26) from go.mod's `go` directive.
        # Passing the full patch (1.26.3) to setup-go pins it exactly even with
        # check-latest; the minor lets check-latest float to the newest patch.
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Latest patch of go.mod's Go minor (e.g. 1.26 -> 1.26.4) rather than
          # a cached or exact-pinned patch, so the check job tests the newest.
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Verify module integrity
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        run: make test

      - name: Set up Terraform
        # For the mock acceptance suite below, which drives a real CLI. Wrapper
        # off so the Makefile sees terraform's real exit codes.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Mock acceptance tests (coverage)
        # Runs on EVERY pull request, unlike the acceptance_mock matrix job below
        # (forks and Dependabot only) and the live sandbox suite (same-repo only,
        # and built without the `testacc` tag so it cannot see these tests at all).
        # Without this step a same-repo PR never executes the mock suite.
        #
        # It is also where the CRUD coverage comes from: a resource's
        # Create/Read/Update/Delete are only reachable through real Terraform, so
        # `make test` alone reports them as untested. One engine is enough here —
        # engine/version compatibility is the matrix job's job, not coverage's.
        run: make testacc-mock

      - name: Upload coverage to Codecov
        # Both profiles go up in ONE call so Codecov merges them into a single
        # report and computes one status. Two separate uploads would each trigger
        # a status calculation, and the first — unit-only — would report the CRUD
        # paths as uncovered until the second arrived.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out,coverage-acceptance.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    # Registry documentation is assembled by tfplugindocs from templates and
    # examples, so it can silently drift from either. This job regenerates it and
    # fails if the committed tree differs, which makes a stale page a merge
    # blocker rather than something noticed after release. It also type-checks
    # every example against the provider built from this commit, so a snippet
    # that no longer compiles cannot reach the registry.
    #
    # Note the pages currently hand-write their argument references rather than
    # rendering them from the schema, so a changed Description does NOT move the
    # published text — see the deferred migration in #256. What is enforced today
    # is that every attribute HAS a usable description (unit tests) and that the
    # committed tree matches what the templates produce.
    #
    # No credentials and no network calls to Namecheap: generation reads the
    # schema from a locally built binary, and `terraform validate` runs behind a
    # dev_overrides config, so this job is fork-safe.
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Set up Terraform
        # tfplugindocs shells out to `terraform providers schema`, and the
        # example validation needs the same binary. Wrapper off so the Makefile
        # sees terraform's real exit codes.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Docs are generated and current
        run: make docs-check

      - name: Examples type-check against this provider
        run: make examples-validate

  security:
    # Trivy scan covers three concerns in one job:
    #  - SCA: CVEs in Go dependencies declared by go.mod / go.sum.
    #  - IaC: misconfigurations in any Terraform or YAML at the
    #    repo root (examples/, .github/workflows/, etc.).
    #  - Secret scan: accidental tokens or keys checked into the tree.
    # A separate step emits a CycloneDX SBOM as a workflow artifact so
    # downstream tooling (dependency-track, release provenance, legal
    # audits) can consume a signed inventory without re-running scans.
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Trivy vuln + misconfig + secret + license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the Trivy binary to the latest scanner release instead of
          # floating on the action's bundled default (v0.70.0 in v0.36.0), so
          # scan behavior is reproducible. Dependabot's github-actions ecosystem
          # bumps the action SHA but NOT this input — bump by hand after
          # reviewing https://github.com/aquasecurity/trivy/releases.
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # License denylist lives in trivy.yaml at repo root; the
          # action auto-loads it before each scanner runs.
          trivy-config: trivy.yaml
          # trivy-action v0.36.0 uses actions/cache@v5 (Node 24) internally.
          cache: "true"

      - name: Trivy report (JSON, all severities, non-gating)
        # Second Trivy pass that NEVER gates (exit-code 0) and drops the
        # CRITICAL,HIGH + ignore-unfixed filters of the gating scan above, so
        # the PR summary can show the full picture (MEDIUM/LOW and unfixed
        # advisories included). The merge gate stays with the table scan above;
        # this JSON is consumed only by the security-report job to render the
        # human summary + artifact. Same pinned Trivy binary as above.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          exit-code: "0"
          format: json
          output: trivy-results.json
          trivy-config: trivy.yaml
          cache: "true"

      - name: Upload Trivy JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-json
          path: trivy-results.json
          retention-days: 90

      - name: Generate CycloneDX SBOM
        # Runs even if the scan above found HIGH/CRITICAL — the SBOM is
        # a static inventory and should be produced regardless of
        # gating outcome so consumers can see what went into the tree.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Same pinned Trivy binary as the scan step above (keep in sync).
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          cache: "true"

      - name: Upload SBOM artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  govulncheck:
    # Go-native vulnerability gate, complementary to the Trivy SCA scan above.
    # Trivy matches go.sum module versions against advisory version ranges;
    # govulncheck additionally does call-graph REACHABILITY analysis against the
    # official Go vulnerability database (https://vuln.go.dev) plus the Go
    # standard library for the toolchain in use. It fails only when a vulnerable
    # symbol is actually reachable from this module's code, which keeps the gate
    # low-noise (imported-but-uncalled vulns are reported but don't block) while
    # still catching every exploitable path — including stdlib CVEs that Trivy's
    # dependency scan doesn't cover. The advisory DB is fetched fresh each run,
    # so detection stays current regardless of the pinned binary version.
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Latest patch of go.mod's Go minor (matches the check job) so stdlib
          # advisories already fixed in a newer patch aren't reported against us.
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Run govulncheck
        # Pin the binary so a govulncheck release can't silently change scan
        # behavior. govulncheck is installed via `go install`, not declared in
        # go.mod (keeping it out of the shipped module graph and the SBOM), so
        # Dependabot's gomod ecosystem does NOT track it — bump this line by
        # hand after reviewing https://github.com/golang/vuln/releases.
        # Exit code 3 (a vuln in CALLED code) fails the job; imported-but-
        # uncalled findings are informational and do not gate.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: govulncheck JSON report (non-gating)
        # Re-run in JSON purely to feed the PR security summary; never gates
        # (|| true). The text run above stays the authoritative reachability
        # gate. Invoked by absolute path in case GOPATH/bin isn't on PATH for
        # this step. Runs even if the gate above failed so the summary can
        # show exactly which vulnerabilities blocked the build.
        if: ${{ !cancelled() }}
        run: |
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          "$GOVULNCHECK" -format json ./... > govulncheck.json || true

      - name: Upload govulncheck JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-json
          path: govulncheck.json
          retention-days: 90

  security-report:
    # Consolidates every security scan into ONE human-readable summary, posted
    # as a sticky PR comment (the visibility ask) and also written to the run's
    # job summary + uploaded as the `security-summary` artifact. REPORTING ONLY
    # — it never gates. The authoritative merge gates remain the `security`
    # (Trivy) and `govulncheck` jobs above; their pass/fail is surfaced verbatim
    # in the summary via needs.*.result, so a green comment can never mask a red
    # gate.
    name: Security scan summary
    needs: [changes, security, govulncheck]
    # Run even when a gate above failed — that's when the summary matters most.
    # But not when the changes gate skipped the scans entirely: there are no
    # scan artifacts to summarize on a docs-only change.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + read go.mod for the dependency overview
      pull-requests: write # post/update the sticky summary comment
      security-events: read # read open CodeQL alerts to enrich the summary
    steps:
      - uses: actions/checkout@v7

      - name: Download scan artifacts
        # Pulls trivy-json, sbom-cyclonedx and govulncheck-json (uploaded by the
        # jobs above) into one directory. merge-multiple flattens them so the
        # files land at scan-artifacts/<file> regardless of artifact name.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: scan-artifacts
          merge-multiple: true

      - name: Fetch open CodeQL alerts (best effort)
        # Default-setup CodeQL runs outside this workflow; its open alerts for
        # this ref are pulled via the API only to enrich the summary. Never
        # fails the job — code scanning disabled, or an analysis that hasn't
        # finished for this ref yet, just yields an empty list.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open&per_page=100" \
            > scan-artifacts/codeql-alerts.json 2>/dev/null || echo '[]' > scan-artifacts/codeql-alerts.json

      - name: Build security summary
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/security-summary.sh \
            scan-artifacts/trivy-results.json \
            scan-artifacts/govulncheck.json \
            scan-artifacts/sbom.cdx.json \
            go.mod \
            scan-artifacts/codeql-alerts.json \
            > security-summary.md
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

      - name: Post or update PR comment
        # Skip whenever the token is read-only and commenting would 403:
        # Dependabot events (secrets redacted) and fork pull_requests (read-only
        # GITHUB_TOKEN). Same-repo PRs and manual dispatch runs post the sticky
        # summary. The job summary + artifact are produced regardless.
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty except on pull_request events, where GITHUB_REF_NAME is
          # "<N>/merge" and the branch lookup below would find nothing.
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          marker='<!-- security-scan-summary -->'
          pr="${EVENT_PR_NUMBER:-}"
          if [ -z "${pr}" ]; then
            pr="$(gh pr list --head "${GITHUB_REF_NAME}" --state open \
                    --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${pr}" ]; then
            echo "No open PR for branch ${GITHUB_REF_NAME}; summary is on the job summary + artifact only."
            exit 0
          fi
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
                        --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          jq -Rs '{body: .}' security-summary.md > comment-payload.json
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input comment-payload.json >/dev/null
            echo "Updated existing summary comment #${existing} on PR #${pr}."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
              --input comment-payload.json >/dev/null
            echo "Posted new summary comment on PR #${pr}."
          fi

  acceptance_mock:
    # Fork-safe, credential-free acceptance tests against the in-process stateful
    # mock (namecheap/mock_server_test.go). Runs on GitHub-hosted ubuntu-latest
    # with NO secrets, and a terraform + OpenTofu version matrix that guards
    # against engine/version-specific plan or state regressions.
    #
    # What this adds over the `check` job — which now runs the same suite on every
    # PR, for coverage — is the engine/version matrix: the oldest supported
    # Terraform, the newest, and OpenTofu. `check` proves the suite passes; this
    # proves it passes on every engine the provider claims to support.
    #
    # It is also the FALLBACK acceptance path for pull requests that cannot reach
    # the live sandbox suite below: fork PRs (secrets are redacted for them) and
    # Dependabot PRs (same). Same-repo, non-Dependabot PRs run the live sandbox
    # suite instead, so those two never both run on one PR.
    name: Mock acceptance (${{ matrix.engine }} ${{ matrix.version }})
    needs: [changes, check]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: "1.5.7" # minimum supported Terraform
          - engine: terraform
            version: "1.16.0" # latest pinned series (mirrors the sandbox job)
          - engine: opentofu
            version: "1.12.3" # latest OpenTofu
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Set up Terraform
        if: ${{ matrix.engine == 'terraform' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: ${{ matrix.engine == 'opentofu' }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - name: Mock acceptance tests
        # ENGINE comes from the workflow-defined matrix (trusted), not from any
        # ${{ github.event.* }} value, so it is safe to branch on in the shell.
        # TF_ACC_PROVIDER_HOST retargets the reattached provider's address at
        # the OpenTofu registry. Do NOT also set TF_ACC_PROVIDER_NAMESPACE: with
        # it unset the harness registers the provider under both default
        # namespaces ("-" and "hashicorp"), which is what import steps that
        # carry an explicit Config resolve to — terraform-plugin-testing writes
        # those configs verbatim, without the required_providers source it
        # injects into apply steps, so a custom namespace 404s against the real
        # registry (see TestAccMockDomainHostRecordImportFormats).
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "${ENGINE}" = "opentofu" ]; then
            bin="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST="registry.opentofu.org"
          else
            bin="$(command -v terraform)"
          fi
          export TF_ACC_TERRAFORM_PATH="${bin}"
          make testacc-mock

  start-runner:
    name: Start self-hosted EC2 runner
    needs: [changes, check, security, govulncheck]
    # The live-API sandbox pipeline needs secrets.* (AWS creds, whitelisted EIP,
    # NAMECHEAP_API_KEY), so it only runs where secrets are available AND the
    # code is trusted: same-repo PRs, pushes to master (post-merge), and manual
    # workflow_dispatch (write access required, so always a maintainer). Never
    # fork PRs (redacted secrets; served by acceptance_mock instead) nor
    # Dependabot events (same). The changes-gate term additionally skips the
    # whole EC2 lifecycle — and its per-run AWS cost — when the diff touches
    # only root markdown/LICENSE/the release-please manifest (most notably the
    # Release PR and its merge commit).
    if: ${{ needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # action-workflow-queue lists workflow runs to wait on
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
      public-ip: ${{ steps.eip-ip.outputs.public-ip }}
    steps:
      - name: Wait for older acceptance runs to finish (single sandbox EIP)
        # The acceptance pipeline uses one whitelisted Elastic IP; two runs at
        # once would both try to associate it. Queue this run (FIFO, no
        # cancellation) behind any older in-progress CI run so only one holds
        # the sandbox EIP at a time. The older run frees it when its
        # stop-runner terminates the instance (termination auto-disassociates
        # the EIP back to the account); this run's launch then associates it
        # via eip-allocation-id.
        uses: ahmadnassri/action-workflow-queue@542658b3a8270cac81ae15d401b0d974732808ac # v1.2.0
        with:
          timeout: 1800000 # 30 min cap for a backlog of queued acceptance runs
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Wait for the sandbox EIP to be free
        # stop-runner's terminate is fire-and-forget, and the workflow queue
        # above only waits for the older RUN to finish -- not for its
        # instance to reach `terminated`, which is when AWS auto-releases
        # the EIP. A back-to-back run can therefore arrive here while the
        # previous instance is still shutting down with the EIP attached.
        # The action's own AssociateAddress does not set AllowReassociation
        # and swallows the failure with a warning, so the run would only
        # fail later (and less obviously) at acceptance_test's "Verify
        # sandbox EIP" gate. Poll here instead: a single read-only
        # DescribeAddresses call when the EIP is already free (the common
        # case), a short wait only under genuine back-to-back contention.
        # On timeout, proceed anyway: if the EIP is still attached at launch
        # the action's AssociateAddress fails warn-only, the instance boots
        # without its whitelisted egress IP (the EIP is its only egress
        # during bootstrap), the runner never registers, and start-runner
        # fails on the action's ~5.5-min registration timeout with the
        # instance terminated by cleanup-on-start-failure. Only if the
        # subnet auto-assigns a public IP does the run instead reach
        # acceptance_test's "Verify sandbox EIP" gate.
        run: |
          # Budget sized ABOVE the observed stop->terminated latency band
          # (22-152s, see SECURITY_COMPLIANCE.md): the previous 120s cap was
          # below its documented upper bound, so a slow shutdown burned a
          # whole launch. The wait is only ever paid under back-to-back
          # contention, so a generous cap is free in the common case. All
          # three uses (loop bound, sleep, warning text) derive from these
          # two variables — change them here only.
          timeout_s=300
          interval_s=5
          attempts=$(( timeout_s / interval_s ))
          for i in $(seq 1 "$attempts"); do
            # Assignment inside the condition so a CLI failure (throttling,
            # expired token, network blip) is handled here instead of
            # aborting the whole job under the shell's -e: this step's
            # contract is poll, warn, proceed — never turn a lookup hiccup
            # into a red run of its own.
            if ! assoc="$(aws ec2 describe-addresses \
              --allocation-ids "$SANDBOX_EIP_ALLOCATION_ID" \
              --query 'Addresses[0].AssociationId' --output text)"; then
              echo "::warning::describe-addresses failed (attempt ${i}/${attempts}); retrying."
              sleep "$interval_s"
              continue
            fi
            if [ -z "$assoc" ] || [ "$assoc" = "None" ]; then
              echo "Sandbox EIP is free."
              exit 0
            fi
            echo "Sandbox EIP still associated (${assoc}); waiting for the previous instance to finish terminating (${i}/${attempts})..."
            sleep "$interval_s"
          done
          echo "::warning::Sandbox EIP still associated after ${timeout_s}s; proceeding. If it is still attached at launch, AssociateAddress fails warn-only and the instance boots without its whitelisted egress IP — expect start-runner to fail at the action's registration timeout (or, with an auto-assigned public IP, at the acceptance \"Verify sandbox EIP\" gate)."
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: namecheap/ec2-github-runner@54ee3e45b519c062993c2b01eb77552fcc329b9d # v4.0.2
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-owner: 699717368611
          ec2-image-filters: >
            [
              { "Name": "name", "Values": ["nc-al2023-ami-hvm-x86_64-master-*"] }
            ]
          ec2-instance-type: t3.medium
          subnet-id: subnet-01c4ff5a
          security-group-id: sg-106ec76d
          iam-role-name: AmazonSSMRoleForInstancesQuickSetup
          # SSE-EBS on the runner's root volume. Uses the launch
          # account's default aws/ebs KMS key; AMI snapshot-id is
          # dropped so AWS re-encrypts at launch time.
          encrypt-ebs: "true"
          # Runs once, as root, during the launch bootstrap. Without this,
          # scripts/hygiene-sweep.sh's `mkdir -p /opt/ci/jobs/current` fails
          # outright: /opt is root-owned 755, and the actions-runner process
          # (and everything run.sh spawns) runs as the unprivileged `runner`
          # user, which has no write access to create a new directory
          # directly under /opt.
          pre-runner-script: |
            mkdir -p /opt/ci
            chown -R runner:runner /opt/ci
          # The action associates this EIP early in its own bootstrap, which is
          # what gives the instance outbound internet connectivity while it
          # registers the runner. The single whitelisted sandbox EIP is also
          # what the Namecheap sandbox API allows, so this association is
          # load-bearing for the acceptance tests, not just for bootstrap.
          eip-allocation-id: ${{ env.SANDBOX_EIP_ALLOCATION_ID }}
          aws-resource-tags: >
            [
              { "Key": "Name", "Value": "github_runner" },
              { "Key": "GitHubRepository", "Value": "${{ github.repository }}" }
            ]
      - name: Resolve sandbox EIP public IP
        id: eip-ip
        # Publish the whitelisted EIP's public IP (from the allocation itself,
        # the source of truth for the IP the Namecheap sandbox API allows) so
        # acceptance_test's credential-free "Verify sandbox EIP" gate can check
        # the runner's actual public IP against it. Also ASSERT the
        # association: the action's AssociateAddress is warn-only, so without
        # this check start-runner could report success while the EIP points
        # at some other (or no) instance and the failure would surface later
        # and less legibly. This step still only reads; it never
        # re-associates a running/registered instance (doing so would change
        # its IP and sever the runner).
        env:
          LAUNCHED_INSTANCE_ID: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
        run: |
          out="$(aws ec2 describe-addresses \
            --allocation-ids "$SANDBOX_EIP_ALLOCATION_ID" \
            --query 'Addresses[0].[PublicIp,InstanceId]' --output text)"
          ip="$(printf '%s' "$out" | cut -f1)"
          assoc_instance="$(printf '%s' "$out" | cut -f2)"
          if [ -z "$ip" ] || [ "$ip" = "None" ]; then
            echo "::error::Could not resolve a public IP for allocation ${SANDBOX_EIP_ALLOCATION_ID}."
            exit 1
          fi
          if [ "$assoc_instance" != "$LAUNCHED_INSTANCE_ID" ]; then
            echo "::error::Sandbox EIP ${SANDBOX_EIP_ALLOCATION_ID} is associated with '${assoc_instance}', not the launched runner instance '${LAUNCHED_INSTANCE_ID}' — the action's warn-only AssociateAddress did not take effect."
            exit 1
          fi
          echo "public-ip=${ip}" >> "$GITHUB_OUTPUT"

  acceptance_test:
    name: Acceptance test
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    needs: [changes, start-runner]
    # Same gate as start-runner: changes-gate `code` + same-repo PRs + pushes
    # to master + manual dispatch, never forks/Dependabot (those get
    # acceptance_mock instead).
    if: ${{ needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
    steps:
      # PRIMARY workspace-hygiene mechanism (git clean -ffdx before checkout).
      # Runs before our own scripts exist on disk, so it — not a custom
      # pre-checkout script — is what guarantees a clean $GITHUB_WORKSPACE at
      # the start of every run.
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Pre-job hygiene sweep
        # Runs AFTER checkout so the script is available. Only ever targets the
        # custom JOB_HOME (the workspace is already handled above by
        # checkout's clean: true). Self-heals + warns if a crashed/cancelled
        # prior run left this non-empty (its own always() post-sweep skipped).
        # TMPDIR is pointed at a subdirectory of JOB_HOME rather than the
        # shared OS /tmp: Go's t.TempDir()/os.CreateTemp and
        # terraform-plugin-testing's scratch dirs both default to $TMPDIR, and
        # without this they'd write to /tmp, which neither this sweep nor the
        # post-job sweep below ever touches -- leaving test artifacts/tfstate
        # outside the swept path. Nesting it under JOB_HOME means it's wiped
        # for free by the same pre/post sweep of that path.
        run: |
          scripts/hygiene-sweep.sh pre /opt/ci/jobs/current
          mkdir -p /opt/ci/jobs/current/tmp
          echo "HOME=/opt/ci/jobs/current" >> "$GITHUB_ENV"
          echo "TMPDIR=/opt/ci/jobs/current/tmp" >> "$GITHUB_ENV"

      - name: Resolve toolchain versions
        id: versions
        run: |
          # Go: latest PATCH of the Go minor pinned by go.mod's `go` directive
          # (the EC2 runner lacks setup-go tooling), mirroring check-latest:
          # true in the check job. Patch bumps (1.26.3 -> 1.26.4) are picked up
          # automatically. A newer Go minor is not auto-adopted and does not
          # fail CI: we fall back to go.mod's exact version, which is also the
          # floor the module requires.
          go_required="$(awk '/^go / {print $2; exit}' go.mod)"
          go_minor="$(printf '%s' "${go_required}" | cut -d. -f1,2)"
          # go.dev/VERSION is Go's own latest-stable endpoint (text: goX.Y.Z);
          # when go.mod's minor is current it IS the latest patch.
          latest_go="$(curl -fsSL https://go.dev/VERSION?m=text | head -1 | sed 's/^go//')"
          latest_minor="$(printf '%s' "${latest_go}" | cut -d. -f1,2)"
          if [ -n "${latest_go}" ] && [ "${latest_minor}" = "${go_minor}" ]; then
            go_version="${latest_go}"   # latest patch in go.mod's minor series
          else
            go_version="${go_required}" # newer minor / lookup unavailable: use go.mod's exact version
          fi
          echo "Using Go ${go_version} (go.mod pins ${go_minor}.x)"
          echo "go_version=${go_version}" >> "$GITHUB_OUTPUT"

          # Pin the Terraform MINOR series, not an exact patch. CI auto-installs
          # the latest patch in this series, so patch bumps (1.15.5 -> 1.15.6)
          # are picked up automatically and never fail. A newer minor/major
          # release (1.16.0, 2.0.0) fails the build instead, so a maintainer can
          # review possible behavior changes before bumping tf_minor/tf_fallback.
          tf_minor="1.16"
          tf_fallback="1.16.0" # install target when the lookup is unavailable
          # checkpoint API == the source `terraform` itself uses for upgrade
          # notices (stable GA only, never RCs); current_version is the newest
          # stable, so when our series is current it IS the latest patch.
          latest_tf="$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform | sed -n 's/.*"current_version":"\([^"]*\)".*/\1/p')"
          latest_minor="${latest_tf%.*}"
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" != "${tf_minor}" ] \
            && [ "$(printf '%s\n%s\n' "${tf_minor}" "${latest_minor}" | sort -V | tail -1)" = "${latest_minor}" ]; then
            echo "::error::A newer Terraform minor/major release exists (${latest_tf}, ${latest_minor}.x); pinned series is ${tf_minor}.x. Review changes and bump tf_minor/tf_fallback in .github/workflows/ci.yml."
            exit 1
          fi
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" = "${tf_minor}" ]; then
            tf_version="${latest_tf}"   # latest patch in the pinned series
          else
            tf_version="${tf_fallback}" # lookup unavailable or lagging the series
          fi
          echo "Using Terraform ${tf_version} (pinned series ${tf_minor}.x)"
          echo "tf_version=${tf_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go (toolcache)
        env:
          GO_VERSION: ${{ steps.versions.outputs.go_version }}
        run: |
          go_version="$GO_VERSION"
          go_dir="/opt/ci/toolcache/go-${go_version}"
          if [ -x "${go_dir}/go/bin/go" ] && "${go_dir}/go/bin/go" version | grep -q "go${go_version} "; then
            echo "Go ${go_version} already present in toolcache at ${go_dir}, skipping download."
          else
            tarball="go${go_version}.linux-amd64.tar.gz"
            curl -fsSLo "${tarball}" "https://dl.google.com/go/${tarball}"
            expected_go_sha="$(curl -fsSL "https://dl.google.com/go/${tarball}.sha256")"
            echo "${expected_go_sha}  ${tarball}" | sha256sum -c -
            rm -rf "${go_dir}"
            mkdir -p "${go_dir}"
            tar -C "${go_dir}" -xzf "${tarball}"
          fi
          echo "${go_dir}/go/bin" >> "$GITHUB_PATH"
          echo "GOCACHE=/opt/ci/cache/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=/opt/ci/cache/go-mod" >> "$GITHUB_ENV"

      - name: Set up Terraform (toolcache)
        env:
          TF_VERSION: ${{ steps.versions.outputs.tf_version }}
        run: |
          tf_version="$TF_VERSION"
          tf_dir="/opt/ci/toolcache/terraform-${tf_version}"
          if [ -x "${tf_dir}/terraform" ] && "${tf_dir}/terraform" version | head -1 | grep -q "v${tf_version}$"; then
            echo "Terraform ${tf_version} already present in toolcache at ${tf_dir}, skipping download."
          else
            curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
            expected_tf_sha="$(curl -fsSL "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_SHA256SUMS" | awk -v f="terraform_${tf_version}_linux_amd64.zip" '$2==f {print $1}')"
            echo "${expected_tf_sha}  terraform.zip" | sha256sum -c -
            rm -rf "${tf_dir}"
            mkdir -p "${tf_dir}"
            unzip -o terraform.zip -d "${tf_dir}"
          fi
          echo "${tf_dir}" >> "$GITHUB_PATH"
          echo "TF_ACC_TERRAFORM_PATH=${tf_dir}/terraform" >> "$GITHUB_ENV"

      - name: Verify sandbox EIP
        # Hard G5 assertion: never run tests without the whitelisted IP. Needs
        # zero AWS credentials — the comparison is a plain public HTTP check
        # against the IP start-runner already resolved and published.
        env:
          EXPECTED_IP: ${{ needs.start-runner.outputs.public-ip }}
        run: |
          actual_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [ -z "${EXPECTED_IP}" ] || [ "${actual_ip}" != "${EXPECTED_IP}" ]; then
            echo "::error::Sandbox EIP mismatch: runner public IP is '${actual_ip}', expected the whitelisted sandbox EIP '${EXPECTED_IP}'. Refusing to run acceptance tests without the whitelisted IP."
            exit 1
          fi
          echo "Verified runner public IP (${actual_ip}) matches the whitelisted sandbox EIP."

      - name: Acceptance Test
        run: |
          export CGO_ENABLED=0
          make testacc
        env:
          NAMECHEAP_USER_NAME: saTerraformProvider
          NAMECHEAP_API_USER: saTerraformProvider
          NAMECHEAP_TEST_DOMAIN: terraform-provider-test.net
          NAMECHEAP_USE_SANDBOX: true
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          # The suite drives two independent clients against one account: the
          # provider under test, and the bare SDK client the test helpers use for
          # setup/teardown. Each carries its own limiter, so leaving both at the
          # default 20/min lets the suite emit up to 40/min against Namecheap's
          # 20/min quota — the API answers 405, the SDK retries four times, and
          # a healthy test fails as "after 4 attempts: retryable HTTP status".
          # Half the quota each keeps the account total inside it. The helper
          # client reads the same variable (see provider_test.go).
          NAMECHEAP_REQUESTS_PER_MINUTE: 10
          # Every retry is itself a request, so retrying quickly makes throttling
          # worse: it spends quota without waiting out the window that rejected
          # the call. Retry FEWER times, spaced FURTHER apart.
          #
          # The SDK doubles each delay from the base, clamps it to the cap, then
          # jitters it to 50-100% of that value, so the figure that matters is the
          # jittered MINIMUM. At 5 attempts with a 10s base and 60s cap the four
          # delays are 10/20/40/60s nominal, so the minimum total is
          # 5+10+20+30 = 65s — past the one-minute window on every run, for five
          # requests. (A 5s base gives a 32.5s minimum and clears the window only
          # about a third of the time; the stock 500ms/30s backoff spends eight
          # requests and still averages under a minute.)
          #
          # Elapsed must cover the whole schedule or the last attempts never
          # happen: 130s of backoff + 5x30s request timeout + limiter waits is
          # ~310s, so 8m leaves headroom while staying well inside the suite's
          # 30m go-test timeout.
          NAMECHEAP_MAX_RETRIES: 5
          NAMECHEAP_RETRY_BASE_DELAY: 10s
          NAMECHEAP_RETRY_MAX_DELAY: 60s
          NAMECHEAP_RETRY_MAX_ELAPSED: 8m

      - name: Post-job hygiene sweep
        # Last step, if: always() — this is what actually satisfies G6 ("no
        # code/env/secrets survive the job"): it runs while the job still
        # owns the instance, covering the window between job end and
        # stop-runner's terminate. The next run's checkout clean: true only
        # protects that NEXT run's start (on its own fresh instance), not
        # this window. Guards for the one case where the script itself can't be on
        # disk: checkout (the job's first step) failing outright. In that case
        # nothing meaningful was written to JOB_HOME this run (HOME is only
        # repointed there by "Pre-job hygiene sweep", which never got to run
        # either) and $GITHUB_WORKSPACE holds at most a partial checkout, but
        # this still cleans both paths inline instead of silently no-op'ing
        # via a bare command-not-found failure.
        if: always()
        run: |
          if [ -x scripts/hygiene-sweep.sh ]; then
            scripts/hygiene-sweep.sh post "$GITHUB_WORKSPACE" /opt/ci/jobs/current
          else
            echo "::warning::scripts/hygiene-sweep.sh not found on disk (checkout likely failed this run) -- falling back to inline cleanup of \$GITHUB_WORKSPACE and /opt/ci/jobs/current"
            rm -rf -- "$GITHUB_WORKSPACE" /opt/ci/jobs/current
            mkdir -p -- "$GITHUB_WORKSPACE" /opt/ci/jobs/current
          fi

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - acceptance_test
    runs-on: ubuntu-latest
    # Runs whenever a runner was actually started, regardless of the triggering
    # event. The instance-id guard is the real safety condition: it is non-empty
    # only when start-runner ran (same-repo PR or push to master), so this
    # correctly tears the runner down for both those cases and no-ops otherwise
    # — including when start-runner was skipped by the changes gate: always()
    # keeps this condition evaluating even then, and the empty instance-id
    # makes it skip cleanly rather than fail or hang. Deliberately NOT gated
    # on needs.changes.outputs.code: if a runner exists it must be stopped,
    # no matter what the gate said.
    if: ${{ always() && needs.start-runner.outputs.ec2-instance-id != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        # if: always() so a failure in "Generate GitHub App token" or
        # "Configure AWS credentials" above doesn't skip stopping the
        # instance.
        if: always()
        uses: namecheap/ec2-github-runner@54ee3e45b519c062993c2b01eb77552fcc329b9d # v4.0.2
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}

  # Summary job with two purposes:
  # 1. A workflow run whose jobs were ALL skipped by the gate would otherwise
  #    have no executed job, making the run-level conclusion (which gates
  #    versioning.yml via workflow_run) ambiguous. This job executes on every
  #    run that isn't cancelled, so the run always concludes success/failure.
  #    `!cancelled()` rather than `always()`: a superseded PR run cancelled by
  #    the concurrency group skips this job instead of spending a runner to
  #    post a red check on a dead SHA (checks are evaluated per-SHA, so the
  #    replacement run supplies the required check).
  # 2. Branch protection can require just this one check instead of listing
  #    every job: it fails if any needed job failed or was cancelled, and
  #    passes when jobs succeeded or were legitimately skipped — by the
  #    changes gate, or by the pre-existing fork/Dependabot/event conditions
  #    on acceptance_mock and the EC2 jobs.
  # Every job in this workflow MUST be listed in `needs` below; the first
  # step asserts that, so a job missing from the list fails this check
  # instead of silently escaping it.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      - changes
      - check
      - docs
      - security
      - govulncheck
      - security-report
      - acceptance_mock
      - start-runner
      - acceptance_test
      - stop-runner
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7

      # "CI OK" only guards the jobs listed in its `needs`. A job added to the
      # workflow but not to that list could fail without turning this check
      # red — the exact gap this job exists to close — so assert the two lists
      # match instead of relying on the note in CI.md.
      - name: Assert every job is watched by this gate
        run: |
          watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/ci.yml | sort)
          all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
          if ! diff <(echo "$all") <(echo "$watched"); then
            echo "::error::ci.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
            exit 1
          fi

      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled — see the results above."
            exit 1
          fi
