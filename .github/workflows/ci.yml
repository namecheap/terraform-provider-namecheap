name: CI

on:
  push:
    branches:
      - "**"
  # pull_request enables CI on PRs FROM FORKS, which the push trigger never fires
  # for. This is what lets external contributors' PRs run the required checks
  # (Check, Trivy, govulncheck) and the credential-free mock acceptance job. The
  # secret-bound EC2 sandbox jobs are explicitly guarded to `push` only (see
  # start-runner / acceptance_test below) so untrusted fork code never reaches
  # the self-hosted runner or the whitelisted-IP secrets. Uses `pull_request`
  # (NOT pull_request_target) so fork PRs run with a read-only token and no
  # secrets — the safe model.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Single source of truth for the whitelisted sandbox Elastic IP within this
  # file. cleanup-ec2-runners.yml repeats this same literal in its own
  # top-level `env:` block — keep the two in sync if this value ever changes.
  SANDBOX_EIP_ALLOCATION_ID: eipalloc-1796f61b

# This workflow intentionally has NO top-level `concurrency` group. A shared
# group serializes the whole workflow, but GitHub keeps only the newest queued
# run per group and cancels older pending ones — so two PRs pushed seconds apart
# silently drop each other's CI. Instead, the cheap `check`/`security` jobs run
# in parallel across PRs (never cancelled), and only `start-runner` serializes —
# it waits for older runs via ahmadnassri/action-workflow-queue so the single
# whitelisted Elastic IP is never associated by two EC2 runners at once. See the
# queue step in start-runner below.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        # Extract just the MAJOR.MINOR (e.g. 1.26) from go.mod's `go` directive.
        # Passing the full patch (1.26.3) to setup-go pins it exactly even with
        # check-latest; the minor lets check-latest float to the newest patch.
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Latest patch of go.mod's Go minor (e.g. 1.26 -> 1.26.4) rather than
          # a cached or exact-pinned patch, so the check job tests the newest.
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Verify module integrity
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    # Trivy scan covers three concerns in one job:
    #  - SCA: CVEs in Go dependencies declared by go.mod / go.sum.
    #  - IaC: misconfigurations in any Terraform or YAML at the
    #    repo root (examples/, .github/workflows/, etc.).
    #  - Secret scan: accidental tokens or keys checked into the tree.
    # A separate step emits a CycloneDX SBOM as a workflow artifact so
    # downstream tooling (dependency-track, release provenance, legal
    # audits) can consume a signed inventory without re-running scans.
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy vuln + misconfig + secret + license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the Trivy binary to the latest scanner release instead of
          # floating on the action's bundled default (v0.70.0 in v0.36.0), so
          # scan behavior is reproducible. Dependabot's github-actions ecosystem
          # bumps the action SHA but NOT this input — bump by hand after
          # reviewing https://github.com/aquasecurity/trivy/releases.
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # License denylist lives in trivy.yaml at repo root; the
          # action auto-loads it before each scanner runs.
          trivy-config: trivy.yaml
          # trivy-action v0.36.0 uses actions/cache@v5 (Node 24) internally.
          cache: "true"

      - name: Trivy report (JSON, all severities, non-gating)
        # Second Trivy pass that NEVER gates (exit-code 0) and drops the
        # CRITICAL,HIGH + ignore-unfixed filters of the gating scan above, so
        # the PR summary can show the full picture (MEDIUM/LOW and unfixed
        # advisories included). The merge gate stays with the table scan above;
        # this JSON is consumed only by the security-report job to render the
        # human summary + artifact. Same pinned Trivy binary as above.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          exit-code: "0"
          format: json
          output: trivy-results.json
          trivy-config: trivy.yaml
          cache: "true"

      - name: Upload Trivy JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-json
          path: trivy-results.json
          retention-days: 90

      - name: Generate CycloneDX SBOM
        # Runs even if the scan above found HIGH/CRITICAL — the SBOM is
        # a static inventory and should be produced regardless of
        # gating outcome so consumers can see what went into the tree.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Same pinned Trivy binary as the scan step above (keep in sync).
          version: v0.71.2
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          cache: "true"

      - name: Upload SBOM artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  govulncheck:
    # Go-native vulnerability gate, complementary to the Trivy SCA scan above.
    # Trivy matches go.sum module versions against advisory version ranges;
    # govulncheck additionally does call-graph REACHABILITY analysis against the
    # official Go vulnerability database (https://vuln.go.dev) plus the Go
    # standard library for the toolchain in use. It fails only when a vulnerable
    # symbol is actually reachable from this module's code, which keeps the gate
    # low-noise (imported-but-uncalled vulns are reported but don't block) while
    # still catching every exploitable path — including stdlib CVEs that Trivy's
    # dependency scan doesn't cover. The advisory DB is fetched fresh each run,
    # so detection stays current regardless of the pinned binary version.
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Latest patch of go.mod's Go minor (matches the check job) so stdlib
          # advisories already fixed in a newer patch aren't reported against us.
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Run govulncheck
        # Pin the binary so a govulncheck release can't silently change scan
        # behavior. govulncheck is installed via `go install`, not declared in
        # go.mod (keeping it out of the shipped module graph and the SBOM), so
        # Dependabot's gomod ecosystem does NOT track it — bump this line by
        # hand after reviewing https://github.com/golang/vuln/releases.
        # Exit code 3 (a vuln in CALLED code) fails the job; imported-but-
        # uncalled findings are informational and do not gate.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: govulncheck JSON report (non-gating)
        # Re-run in JSON purely to feed the PR security summary; never gates
        # (|| true). The text run above stays the authoritative reachability
        # gate. Invoked by absolute path in case GOPATH/bin isn't on PATH for
        # this step. Runs even if the gate above failed so the summary can
        # show exactly which vulnerabilities blocked the build.
        if: ${{ !cancelled() }}
        run: |
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          "$GOVULNCHECK" -format json ./... > govulncheck.json || true

      - name: Upload govulncheck JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-json
          path: govulncheck.json
          retention-days: 90

  security-report:
    # Consolidates every security scan into ONE human-readable summary, posted
    # as a sticky PR comment (the visibility ask) and also written to the run's
    # job summary + uploaded as the `security-summary` artifact. REPORTING ONLY
    # — it never gates. The authoritative merge gates remain the `security`
    # (Trivy) and `govulncheck` jobs above; their pass/fail is surfaced verbatim
    # in the summary via needs.*.result, so a green comment can never mask a red
    # gate.
    name: Security scan summary
    needs: [security, govulncheck]
    # Run even when a gate above failed — that's when the summary matters most.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + read go.mod for the dependency overview
      pull-requests: write # post/update the sticky summary comment
      security-events: read # read open CodeQL alerts to enrich the summary
    steps:
      - uses: actions/checkout@v7

      - name: Download scan artifacts
        # Pulls trivy-json, sbom-cyclonedx and govulncheck-json (uploaded by the
        # jobs above) into one directory. merge-multiple flattens them so the
        # files land at scan-artifacts/<file> regardless of artifact name.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: scan-artifacts
          merge-multiple: true

      - name: Fetch open CodeQL alerts (best effort)
        # Default-setup CodeQL runs outside this workflow; its open alerts for
        # this ref are pulled via the API only to enrich the summary. Never
        # fails the job — code scanning disabled, or an analysis that hasn't
        # finished for this ref yet, just yields an empty list.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open&per_page=100" \
            > scan-artifacts/codeql-alerts.json 2>/dev/null || echo '[]' > scan-artifacts/codeql-alerts.json

      - name: Build security summary
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/security-summary.sh \
            scan-artifacts/trivy-results.json \
            scan-artifacts/govulncheck.json \
            scan-artifacts/sbom.cdx.json \
            go.mod \
            scan-artifacts/codeql-alerts.json \
            > security-summary.md
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

      - name: Post or update PR comment
        # Skip whenever the token is read-only and commenting would 403:
        #  - Dependabot pushes (secrets redacted), and
        #  - fork pull_requests (fork head repo != this repo), which get a
        #    read-only GITHUB_TOKEN.
        # Push runs and same-repo (internal) PRs keep a writable token and post
        # the sticky summary. The job summary + artifact are produced regardless.
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          marker='<!-- security-scan-summary -->'
          pr="$(gh pr list --head "${GITHUB_REF_NAME}" --state open \
                  --json number --jq '.[0].number // empty')"
          if [ -z "${pr}" ]; then
            echo "No open PR for branch ${GITHUB_REF_NAME}; summary is on the job summary + artifact only."
            exit 0
          fi
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
                        --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          jq -Rs '{body: .}' security-summary.md > comment-payload.json
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input comment-payload.json >/dev/null
            echo "Updated existing summary comment #${existing} on PR #${pr}."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
              --input comment-payload.json >/dev/null
            echo "Posted new summary comment on PR #${pr}."
          fi

  acceptance_mock:
    # Fork-safe, credential-free acceptance tests against the in-process stateful
    # mock (namecheap/mock_server_test.go). Runs on GitHub-hosted ubuntu-latest
    # for EVERY pull request — including forks — and uses NO secrets, unlike the
    # push-only EC2 sandbox pipeline below. A terraform + OpenTofu version matrix
    # guards against engine/version-specific plan or state regressions. This job
    # is additive (not a required status check); it complements, and never
    # replaces, the live sandbox suite.
    name: Mock acceptance (${{ matrix.engine }} ${{ matrix.version }})
    needs: [check]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: "1.5.7" # minimum supported Terraform
          - engine: terraform
            version: "1.15.5" # latest pinned series (mirrors the sandbox job)
          - engine: opentofu
            version: "1.12.3" # latest OpenTofu
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go minor from go.mod
        id: gomod
        run: echo "minor=$(awk '/^go / {print $2; exit}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.gomod.outputs.minor }}
          check-latest: true

      - name: Set up Terraform
        if: ${{ matrix.engine == 'terraform' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: ${{ matrix.engine == 'opentofu' }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - name: Mock acceptance tests
        # ENGINE comes from the workflow-defined matrix (trusted), not from any
        # ${{ github.event.* }} value, so it is safe to branch on in the shell.
        # OpenTofu resolves provider source addresses more strictly than
        # Terraform, so the test harness is pointed at an address it accepts.
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "${ENGINE}" = "opentofu" ]; then
            bin="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST="registry.opentofu.org"
            export TF_ACC_PROVIDER_NAMESPACE="namecheap"
          else
            bin="$(command -v terraform)"
          fi
          export TF_ACC_TERRAFORM_PATH="${bin}"
          make testacc-mock

  start-runner:
    name: Start self-hosted EC2 runner
    needs: [check, security, govulncheck]
    # push-only: this pipeline needs secrets.* (AWS creds, whitelisted EIP,
    # NAMECHEAP_API_KEY) and runs untrusted-if-forked code on the self-hosted
    # runner, so it must never run on pull_request events — fork PRs get a
    # read-only token with secrets redacted and would fail at "Configure AWS
    # credentials" anyway, and pull_request_target is deliberately not used. It
    # keeps running on every push (internal branches), unchanged. Dependabot is
    # also excluded (its runs have no secrets either).
    if: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # action-workflow-queue lists workflow runs to wait on
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
      public-ip: ${{ steps.verify-eip.outputs.public-ip }}
    steps:
      - name: Wait for older acceptance runs to release the EIP
        # The acceptance pipeline associates one whitelisted Elastic IP to its
        # ephemeral EC2 runner; two runners at once would fight over that IP.
        # Queue this run (FIFO, no cancellation) behind any older in-progress CI
        # run, which holds the IP until its stop-runner job terminates the host.
        uses: ahmadnassri/action-workflow-queue@542658b3a8270cac81ae15d401b0d974732808ac # v1.2.0
        with:
          timeout: 1800000 # 30 min cap for a backlog of queued acceptance runs
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Wait for sandbox EIP to become free
        # Precondition gate for the cold-launch "Start EC2 runner" step below.
        # This script never associates the EIP itself (only the action's own
        # eip-allocation-id input does, on a genuine cold launch) -- it just
        # blocks until the allocation is unassociated (or reaps it off a
        # stopped, NOT-ours instance) so that association doesn't race a
        # still-live holder in another repo/run. If the current holder is
        # this repo's own stopped warm-pool instance, this step is a no-op:
        # see scripts/eip-mutex.sh's wait-until-free comments for why that
        # case is deliberately left untouched.
        run: scripts/eip-mutex.sh wait-until-free "$SANDBOX_EIP_ALLOCATION_ID"
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: namecheap/ec2-github-runner@c5db9f03dff1e63a46d40c9b94a49fc5ee6feff1 # v4.0.0 @ 2026-07-02
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-owner: 699717368611
          ec2-image-filters: >
            [
              { "Name": "name", "Values": ["nc-al2023-ami-hvm-x86_64-master-*"] }
            ]
          ec2-instance-type: t3.medium
          subnet-id: subnet-01c4ff5a
          security-group-id: sg-106ec76d
          reuse: stop
          reuse-pool-tag: sandbox-acceptance
          iam-role-name: AmazonSSMRoleForInstancesQuickSetup
          # SSE-EBS on the runner's root volume. Uses the launch
          # account's default aws/ebs KMS key; AMI snapshot-id is
          # dropped so AWS re-encrypts at launch time.
          encrypt-ebs: "true"
          # Restores the action's own early association (removed by mistake in
          # #281): this is what gives the instance internet connectivity during
          # its own bootstrap, on both a cold launch and (implicitly, since the
          # EIP is left attached across stop/start) a warm restart.
          eip-allocation-id: ${{ env.SANDBOX_EIP_ALLOCATION_ID }}
          aws-resource-tags: >
            [
              { "Key": "Name", "Value": "github_runner" },
              { "Key": "GitHubRepository", "Value": "${{ github.repository }}" }
            ]
      - name: Verify EIP ownership
        id: verify-eip
        # Hard-fail gate: confirms the EIP that's supposed to be ours (either
        # just associated by the action's own eip-allocation-id on a cold
        # launch, or already attached from a prior run on a warm restart) is
        # still associated with the exact instance start-ec2-runner reports.
        # Catches both the residual cold-launch race between the wait step
        # above and the action's own associate call, and a cross-repo steal
        # that could have hit a warm-restart instance while it sat stopped
        # (see SECURITY_COMPLIANCE.md's cross-repo hazard note). Never
        # proceeds to run tests without this confirmation.
        env:
          EC2_INSTANCE_ID: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
        run: |
          ip="$(scripts/eip-mutex.sh verify "$SANDBOX_EIP_ALLOCATION_ID" "$EC2_INSTANCE_ID")"
          echo "public-ip=${ip}" >> "$GITHUB_OUTPUT"

  acceptance_test:
    name: Acceptance test
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    needs: start-runner
    # push-only, mirroring start-runner (this is the live-API sandbox run on the
    # self-hosted EC2 runner). Fork PRs are served by acceptance_mock instead.
    if: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
    steps:
      # PRIMARY workspace-hygiene mechanism (git clean -ffdx before checkout).
      # Runs before our own scripts exist on disk, so it — not a custom
      # pre-checkout script — is what guarantees a clean $GITHUB_WORKSPACE at
      # the start of every run, warm-pool reuse included.
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Pre-job hygiene sweep
        # Runs AFTER checkout so the script is available. Only ever targets the
        # custom JOB_HOME (the workspace is already handled above by
        # checkout's clean: true). Self-heals + warns if a crashed/cancelled
        # prior run left this non-empty (its own always() post-sweep skipped).
        # TMPDIR is pointed at a subdirectory of JOB_HOME rather than the
        # shared OS /tmp: Go's t.TempDir()/os.CreateTemp and
        # terraform-plugin-testing's scratch dirs both default to $TMPDIR, and
        # without this they'd write to /tmp, which neither this sweep nor the
        # post-job sweep below ever touches -- leaving test artifacts/tfstate
        # on the reused warm-pool disk. Nesting it under JOB_HOME means it's
        # wiped for free by the same pre/post sweep of that path.
        run: |
          scripts/hygiene-sweep.sh pre /opt/ci/jobs/current
          mkdir -p /opt/ci/jobs/current/tmp
          echo "HOME=/opt/ci/jobs/current" >> "$GITHUB_ENV"
          echo "TMPDIR=/opt/ci/jobs/current/tmp" >> "$GITHUB_ENV"

      - name: Resolve toolchain versions
        id: versions
        run: |
          # Go: latest PATCH of the Go minor pinned by go.mod's `go` directive
          # (the EC2 runner lacks setup-go tooling), mirroring check-latest:
          # true in the check job. Patch bumps (1.26.3 -> 1.26.4) are picked up
          # automatically. A newer Go minor is not auto-adopted and does not
          # fail CI: we fall back to go.mod's exact version, which is also the
          # floor the module requires.
          go_required="$(awk '/^go / {print $2; exit}' go.mod)"
          go_minor="$(printf '%s' "${go_required}" | cut -d. -f1,2)"
          # go.dev/VERSION is Go's own latest-stable endpoint (text: goX.Y.Z);
          # when go.mod's minor is current it IS the latest patch.
          latest_go="$(curl -fsSL https://go.dev/VERSION?m=text | head -1 | sed 's/^go//')"
          latest_minor="$(printf '%s' "${latest_go}" | cut -d. -f1,2)"
          if [ -n "${latest_go}" ] && [ "${latest_minor}" = "${go_minor}" ]; then
            go_version="${latest_go}"   # latest patch in go.mod's minor series
          else
            go_version="${go_required}" # newer minor / lookup unavailable: use go.mod's exact version
          fi
          echo "Using Go ${go_version} (go.mod pins ${go_minor}.x)"
          echo "go_version=${go_version}" >> "$GITHUB_OUTPUT"

          # Pin the Terraform MINOR series, not an exact patch. CI auto-installs
          # the latest patch in this series, so patch bumps (1.15.5 -> 1.15.6)
          # are picked up automatically and never fail. A newer minor/major
          # release (1.16.0, 2.0.0) fails the build instead, so a maintainer can
          # review possible behavior changes before bumping tf_minor/tf_fallback.
          tf_minor="1.15"
          tf_fallback="1.15.5" # install target when the lookup is unavailable
          # checkpoint API == the source `terraform` itself uses for upgrade
          # notices (stable GA only, never RCs); current_version is the newest
          # stable, so when our series is current it IS the latest patch.
          latest_tf="$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform | sed -n 's/.*"current_version":"\([^"]*\)".*/\1/p')"
          latest_minor="${latest_tf%.*}"
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" != "${tf_minor}" ] \
            && [ "$(printf '%s\n%s\n' "${tf_minor}" "${latest_minor}" | sort -V | tail -1)" = "${latest_minor}" ]; then
            echo "::error::A newer Terraform minor/major release exists (${latest_tf}, ${latest_minor}.x); pinned series is ${tf_minor}.x. Review changes and bump tf_minor/tf_fallback in .github/workflows/ci.yml."
            exit 1
          fi
          if [ -n "${latest_tf}" ] && [ "${latest_minor}" = "${tf_minor}" ]; then
            tf_version="${latest_tf}"   # latest patch in the pinned series
          else
            tf_version="${tf_fallback}" # lookup unavailable or lagging the series
          fi
          echo "Using Terraform ${tf_version} (pinned series ${tf_minor}.x)"
          echo "tf_version=${tf_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go (toolcache)
        env:
          GO_VERSION: ${{ steps.versions.outputs.go_version }}
        run: |
          go_version="$GO_VERSION"
          go_dir="/opt/ci/toolcache/go-${go_version}"
          if [ -x "${go_dir}/go/bin/go" ] && "${go_dir}/go/bin/go" version | grep -q "go${go_version} "; then
            echo "Go ${go_version} already present in toolcache at ${go_dir}, skipping download."
          else
            tarball="go${go_version}.linux-amd64.tar.gz"
            curl -fsSLo "${tarball}" "https://dl.google.com/go/${tarball}"
            expected_go_sha="$(curl -fsSL "https://dl.google.com/go/${tarball}.sha256")"
            echo "${expected_go_sha}  ${tarball}" | sha256sum -c -
            rm -rf "${go_dir}"
            mkdir -p "${go_dir}"
            tar -C "${go_dir}" -xzf "${tarball}"
          fi
          echo "${go_dir}/go/bin" >> "$GITHUB_PATH"
          echo "GOCACHE=/opt/ci/cache/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=/opt/ci/cache/go-mod" >> "$GITHUB_ENV"

      - name: Set up Terraform (toolcache)
        env:
          TF_VERSION: ${{ steps.versions.outputs.tf_version }}
        run: |
          tf_version="$TF_VERSION"
          tf_dir="/opt/ci/toolcache/terraform-${tf_version}"
          if [ -x "${tf_dir}/terraform" ] && "${tf_dir}/terraform" version | head -1 | grep -q "v${tf_version}$"; then
            echo "Terraform ${tf_version} already present in toolcache at ${tf_dir}, skipping download."
          else
            curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
            expected_tf_sha="$(curl -fsSL "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_SHA256SUMS" | awk -v f="terraform_${tf_version}_linux_amd64.zip" '$2==f {print $1}')"
            echo "${expected_tf_sha}  terraform.zip" | sha256sum -c -
            rm -rf "${tf_dir}"
            mkdir -p "${tf_dir}"
            unzip -o terraform.zip -d "${tf_dir}"
          fi
          echo "${tf_dir}" >> "$GITHUB_PATH"
          echo "TF_ACC_TERRAFORM_PATH=${tf_dir}/terraform" >> "$GITHUB_ENV"

      - name: Verify sandbox EIP
        # Hard G5 assertion: never run tests without the whitelisted IP. Needs
        # zero AWS credentials — the comparison is a plain public HTTP check
        # against the IP start-runner already resolved and published.
        env:
          EXPECTED_IP: ${{ needs.start-runner.outputs.public-ip }}
        run: |
          actual_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [ -z "${EXPECTED_IP}" ] || [ "${actual_ip}" != "${EXPECTED_IP}" ]; then
            echo "::error::Sandbox EIP mismatch: runner public IP is '${actual_ip}', expected the whitelisted sandbox EIP '${EXPECTED_IP}'. Refusing to run acceptance tests without the whitelisted IP."
            exit 1
          fi
          echo "Verified runner public IP (${actual_ip}) matches the whitelisted sandbox EIP."

      - name: Acceptance Test
        run: |
          export CGO_ENABLED=0
          make testacc
        env:
          NAMECHEAP_USER_NAME: saTerraformProvider
          NAMECHEAP_API_USER: saTerraformProvider
          NAMECHEAP_TEST_DOMAIN: terraform-provider-test.net
          NAMECHEAP_USE_SANDBOX: true
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}

      - name: Post-job hygiene sweep
        # Last step, if: always() — this is what actually satisfies G6 ("no
        # code/env/secrets survive on the stopped disk"), since it runs before
        # the instance goes idle/stopped. The next run's checkout clean: true
        # only protects that NEXT run's start, not this run's stopped-disk
        # window. Guards for the one case where the script itself can't be on
        # disk: checkout (the job's first step) failing outright. In that case
        # nothing meaningful was written to JOB_HOME this run (HOME is only
        # repointed there by "Pre-job hygiene sweep", which never got to run
        # either) and $GITHUB_WORKSPACE holds at most a partial checkout, but
        # this still cleans both paths inline instead of silently no-op'ing
        # via a bare command-not-found failure.
        if: always()
        run: |
          if [ -x scripts/hygiene-sweep.sh ]; then
            scripts/hygiene-sweep.sh post "$GITHUB_WORKSPACE" /opt/ci/jobs/current
          else
            echo "::warning::scripts/hygiene-sweep.sh not found on disk (checkout likely failed this run) -- falling back to inline cleanup of \$GITHUB_WORKSPACE and /opt/ci/jobs/current"
            rm -rf -- "$GITHUB_WORKSPACE" /opt/ci/jobs/current
            mkdir -p -- "$GITHUB_WORKSPACE" /opt/ci/jobs/current
          fi

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - acceptance_test
    runs-on: ubuntu-latest
    # push-only (explicit), and only if a runner was actually started. The
    # instance-id guard alone already makes this safe on PR events (start-runner
    # is skipped there, so the output is empty), but stating the push condition
    # keeps the "sandbox pipeline never runs on pull_request" invariant robust
    # against future refactors of how that output is produced.
    if: ${{ always() && github.event_name == 'push' && needs.start-runner.outputs.ec2-instance-id != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        # if: always() so a failure in "Generate GitHub App token" or
        # "Configure AWS credentials" above doesn't skip stopping the
        # instance.
        if: always()
        uses: namecheap/ec2-github-runner@c5db9f03dff1e63a46d40c9b94a49fc5ee6feff1 # v4.0.0 @ 2026-07-02
        with:
          mode: stop
          reuse: stop
          reuse-pool-tag: sandbox-acceptance
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
